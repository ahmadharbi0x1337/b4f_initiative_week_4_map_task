<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Form</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="/vendors/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <form action="#" id="form">
      <fieldset>
        <label for="name">Full Name</label>
        <input id="name" type="text" required placeholder="Your Name" />
        <br />

        <h4>Gender</h4> 
        <br />
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label><br />
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label><br />

        <h4>Coordinates</h4>
        <label for="lang">Lang</label>
        <input type="number" required id="lang" />
        <label for="lang">Lat</label>
        <input type="number" required id="lat" />
        <!-- TODO -->
        <!-- Save Btn -->
        <button type="button" id="save">Save</button>
        <!-- Draw Btn -->
        <button type="button" id="draw">Draw</button>
      </fieldset>
      <!-- Draw Btn -->
    </form>
    <div id="map"></div>
    <script src="/vendors/leaflet/dist/leaflet.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
